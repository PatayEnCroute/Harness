# Template Harness : couche de harness Claude Code + OpenSpec, agnostique de la stack, portée sur Codex, OpenCode, Antigravity et DeepSeek Harness.
# Usage : npx github:PatayEnCroute/Harness   (ou uvx copier copy --trust gh:PatayEnCroute/Harness .   puis /hx-setup dans Claude Code).

_min_copier_version: "9.19.1"
_subdirectory: template
_answers_file: .copier-answers.yml

# Sans CI (ci=false) : ni workflow, ni Dependabot, ni action d'outillage. Sans codeowners : pas de CODEOWNERS.
_exclude:
  - "{% if not ci and not codeowners %}.github{% endif %}"
  - "{% if not ci %}.github/workflows{% endif %}"
  - "{% if not ci %}.github/dependabot.yml{% endif %}"
  - "{% if not ci %}.harness/ci{% endif %}"
  - "{% if not codeowners %}.github/CODEOWNERS{% endif %}"

# Fichiers spécifiques au projet : créés une fois, jamais réécrits par `copier update`.
_skip_if_exists:
  - .harness/config.json
  - .harness/project.md
  - .harness/ci/setup/action.yml
  - .github/dependabot.yml   # le projet peut déjà avoir le sien
  - .github/CODEOWNERS       # idem

# `openspec init` se relance sans risque : il ajoute les harness choisis depuis la dernière fois et garde config.yaml.
_tasks:
  - command: node .harness/hx.mjs openspec init --tools claude{% for tool in tools %},{{ tool }}{% endfor %} .
  - command: node .harness/hx.mjs openspec update .
    when: "{{ _copier_operation == 'update' }}"
  - command: node .harness/hx.mjs migrate   # config.json n'est jamais réécrit : on y ajoute les clés nouvelles
    when: "{{ _copier_operation == 'update' }}"
  # Fichiers des autres harness, générés depuis CLAUDE.md et .claude/ (--force : comme CLAUDE.md, un AGENTS.md existant est remplacé).
  - command: node .harness/hx.mjs adapters --force --tools claude{% for tool in tools %},{{ tool }}{% endfor %}

# La CLI openspec est installée par le hook de démarrage de session ; /hx-setup finit par hx doctor.
_message_after_copy: |
  Harness installé dans {{ project_name }}. Étape suivante, dans Claude Code : /hx-setup (personnalisation à la stack).

project_name:
  type: str
  help: Nom du projet
  default: "{{ _folder_name }}"

ci:
  type: bool
  help: Ajouter le workflow GitHub Actions hx-check ?
  default: true

default_branch:
  type: str
  help: Branche principale (déclenche hx-check au push)
  default: main
  when: "{{ ci }}"

codeowners:
  type: str
  help: "Relecteurs obligatoires du harness et des specs (@utilisateur ou @org/équipe, séparés par des espaces ; vide : pas de CODEOWNERS)"
  default: ""

tools:
  type: str
  help: "Autres harness à rendre compatibles, en plus de Claude Code (espace pour cocher)"
  multiselect: true
  choices:
    Codex: codex
    OpenCode: opencode
    Antigravity: antigravity
    DeepSeek Harness: dsh
  default: []

# Calculée, jamais posée : une question verrait sa réponse figée dans .copier-answers.yml,
# et `copier update` n'apporterait jamais la nouvelle version épinglée aux projets existants.
openspec_version:
  type: str
  default: "1.14.3"
  when: false
