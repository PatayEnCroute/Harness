# Template Harness : couche de harness Claude Code + OpenSpec, agnostique de la stack.
# Usage : uvx copier copy --trust gh:PatayEnCroute/Harness .   puis /hx-setup dans Claude Code.

_min_copier_version: "9.19.1"
_subdirectory: template
_answers_file: .copier-answers.yml

# Sans CI (ci=false) : ni workflow, ni Dependabot, ni action d'outillage. Sans codeowners : pas de CODEOWNERS.
_exclude:
  - "{% if not ci and not codeowners %}.github{% endif %}"
  - "{% if not ci %}.github/workflows{% endif %}"
  - "{% if not ci %}.github/dependabot.yml{% endif %}"
  - "{% if not ci %}.harness/ci{% endif %}"
  - "{% if not codeowners %}.github/CODEOWNERS{% endif %}"

# Fichiers spécifiques au projet : créés une fois, jamais réécrits par `copier update`.
_skip_if_exists:
  - .harness/config.json
  - .harness/project.md
  - .harness/ci/setup/action.yml
  - .github/dependabot.yml   # le projet peut déjà avoir le sien
  - .github/CODEOWNERS       # idem

_tasks:
  - command: node .harness/hx.mjs openspec init --tools claude .
    when: "{{ _copier_operation == 'copy' }}"
  - command: node .harness/hx.mjs openspec update .
    when: "{{ _copier_operation == 'update' }}"
  - command: node .harness/hx.mjs migrate   # config.json n'est jamais réécrit : on y ajoute les clés nouvelles
    when: "{{ _copier_operation == 'update' }}"

_message_after_copy: |
  Harness installé dans {{ project_name }}. Étapes suivantes :
    1. npm i -g @fission-ai/openspec@{{ openspec_version }}   (CLI requise par les commandes /opsx:*)
    2. Dans Claude Code : /hx-setup                         (personnalisation à la stack)
    3. node .harness/hx.mjs doctor                     (vérification)

project_name:
  type: str
  help: Nom du projet
  default: "{{ _folder_name }}"

ci:
  type: bool
  help: Ajouter le workflow GitHub Actions hx-check ?
  default: true

default_branch:
  type: str
  help: Branche principale (déclenche hx-check au push)
  default: main
  when: "{{ ci }}"

codeowners:
  type: str
  help: "Relecteurs obligatoires du harness et des specs (@utilisateur ou @org/équipe, séparés par des espaces ; vide : pas de CODEOWNERS)"
  default: ""

# Calculée, jamais posée : une question verrait sa réponse figée dans .copier-answers.yml,
# et `copier update` n'apporterait jamais la nouvelle version épinglée aux projets existants.
openspec_version:
  type: str
  default: "1.14.3"
  when: false
